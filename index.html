function slices(segs){const o=[];for(const [s,e] of segs){let t=s;while(t<e){const d=new Date(t),nx=new Date(d);nx.setMinutes(0,0,0);nx.setHours(d.getHours()+1);const te=Math.min(nx.getTime(),e);o.push({t,ms:te-t,h:d.getHours()});t=te}}return o}

const place=i=>S.places.find(p=>p.id===i),sortP=a=>[...a].sort((x,y)=>Object.keys(TY).indexOf(x.type)-Object.keys(TY).indexOf(y.type)||String(x.name).localeCompare(String(y.name),'ru',{numeric:true}));

// ---- sheet (spring-like curve, same path in/out, drag to dismiss)

function makeDb(){const api=(m,p,b)=>fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json','X-Init':(window.Telegram&&Telegram.WebApp.initData)||''},body:b?JSON.stringify(b):undefined}).then(r=>{if(!r.ok)throw new Error('Нет доступа ('+r.status+')');return r.json()}).then(j=>{if(m!=='GET')dispatchEvent(new Event('rf'));return j});
 const w=(m,n,i)=>d=>api(m,n+'/'+i,d);return{collection:n=>({doc:i=>({set:w('PUT',n,i),update:w('PATCH',n,i),delete:()=>api('DELETE',n+'/'+i)}),
 onSnapshot(next,err){let last='';const f=async()=>{try{const r=await api('GET',n),j=JSON.stringify(r);if(j!==last){last=j;next({docs:Object.entries(r).map(([id,v])=>({id,data:()=>v}))})}}catch(e){err&&err(e)}};f();setInterval(f,3000);addEventListener('rf',f)}})}}
db=makeDb();
const upd_=()=>{if(document.activeElement?.matches('#m input,#m select'))dirty=true;else render()};
for(const [n,k] of [['places','places'],['tariffs','tariffs'],['sessions','sessions'],['expenses','expenses'],['shifts','shifts']])col(n).onSnapshot(q=>{S[k]=q.docs.map(d=>({id:d.id,...d.data()}));upd_()},er=>{$('#m').textContent='Ошибка: '+er.message});
col('cfg').onSnapshot(q=>{const d=q.docs.find(x=>x.id==='main');S.cfg=d?d.data():DEF;upd_()});
render();setInterval(tick,1000);setTimeout(tick,50);
</script></body></html>
